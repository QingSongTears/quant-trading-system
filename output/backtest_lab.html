<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>回测实验室 · 参数调整 · 日志对比</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#0f1117; --card:#1a1d27; --border:#2a2d3a;
  --text:#e0e0e0; --dim:#888; --accent:#4fc3f7;
  --green:#4caf50; --red:#ef5350; --yellow:#ffa726; --orange:#ff7043;
}
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
header { background:var(--card); border-bottom:1px solid var(--border); padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
header h1 { font-size:1.1rem; font-weight:600; }
header a { color:var(--dim); text-decoration:none; font-size:0.8rem; }
header a:hover { color:var(--accent); }
header .nav-links { margin-left:auto; display:flex; gap:12px; }
.container { max-width:1400px; margin:0 auto; padding:16px; }

/* 布局 */
.lab-layout { display:grid; grid-template-columns:340px 1fr; gap:16px; }
.sidebar { display:flex; flex-direction:column; gap:12px; }
.main-area { display:flex; flex-direction:column; gap:16px; }

.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
.card-title { font-size:0.72rem; text-transform:uppercase; color:var(--dim); letter-spacing:0.8px; margin-bottom:10px; font-weight:600; }

/* 表单 */
.form-group { margin-bottom:12px; }
.form-group label { display:block; font-size:0.78rem; color:var(--dim); margin-bottom:4px; font-weight:500; }
.form-control { width:100%; padding:8px 12px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.85rem; outline:none; }
.form-control:focus { border-color:var(--accent); }
.form-control-sm { padding:6px 10px; font-size:0.8rem; }
select.form-control { cursor:pointer; }
input[type="range"] { width:100%; accent-color:var(--accent); height:4px; }

/* 参数面板 */
.param-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.param-row label { font-size:0.78rem; color:var(--dim); min-width:70px; }
.param-row input[type="range"] { flex:1; }
.param-value { font-size:0.8rem; font-weight:600; color:var(--accent); min-width:36px; text-align:right; }

/* 按钮 */
.btn { padding:8px 20px; border:none; border-radius:6px; cursor:pointer; font-size:0.85rem; font-weight:600; transition:opacity 0.15s; }
.btn:hover { opacity:0.85; }
.btn-primary { background:var(--accent); color:#000; }
.btn-success { background:var(--green); color:#000; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { border-color:var(--accent); color:var(--accent); }
.btn-sm { padding:5px 12px; font-size:0.78rem; }
.btn:disabled { opacity:0.4; cursor:not-allowed; }

/* 搜索 */
.search-wrap { position:relative; }
.search-wrap .suggestions { position:absolute; top:100%; left:0; right:0; background:var(--card); border:1px solid var(--border); border-radius:0 0 8px 8px; z-index:100; max-height:200px; overflow-y:auto; display:none; }
.search-wrap .suggestions div { padding:8px 12px; cursor:pointer; font-size:0.8rem; border-bottom:1px solid var(--border); }
.search-wrap .suggestions div:hover { background:#2a2d3a; }
.search-wrap .suggestions div:last-child { border-bottom:none; }

/* 指标卡片 */
.metrics-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px,1fr)); gap:8px; }
.metric-card { text-align:center; padding:10px 6px; border-radius:8px; background:rgba(255,255,255,0.02); border:1px solid var(--border); }
.metric-val { font-size:1.2rem; font-weight:700; }
.metric-label { font-size:0.65rem; color:var(--dim); margin-top:2px; text-transform:uppercase; }
.m-up { color:var(--red); }
.m-down { color:var(--green); }

/* 图表 */
.chart-wrap { height:320px; position:relative; }

/* 交易表 */
.table-wrap { max-height:240px; overflow-y:auto; }
table { width:100%; border-collapse:collapse; font-size:0.78rem; }
th { text-align:left; padding:6px 8px; color:var(--dim); font-weight:600; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--card); }
td { padding:5px 8px; border-bottom:1px solid rgba(42,45,58,0.3); }
tr:hover td { background:rgba(255,255,255,0.02); }
.text-right { text-align:right; }

/* 日志表 */
.log-grid { display:flex; flex-direction:column; gap:6px; max-height:400px; overflow-y:auto; }
.log-row { display:grid; grid-template-columns:36px 1fr 80px 70px 70px 70px auto; align-items:center; gap:6px; padding:8px 10px; border-radius:6px; background:rgba(255,255,255,0.01); border:1px solid var(--border); cursor:pointer; font-size:0.78rem; transition:background 0.12s; }
.log-row:hover { background:rgba(79,195,247,0.05); }
.log-row.selected { border-color:var(--accent); background:rgba(79,195,247,0.08); }
.log-row input[type="checkbox"] { accent-color:var(--accent); width:16px; height:16px; cursor:pointer; }
.log-time { color:var(--dim); font-size:0.72rem; }
.log-strat { font-weight:600; }
.log-code { font-family:monospace; color:var(--accent); }
.log-return { font-weight:600; }
.log-sharpe { }

/* 对比模态 */
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:200; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal-content { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; width:90%; max-width:1000px; max-height:85vh; overflow-y:auto; }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.modal-close { font-size:1.5rem; cursor:pointer; color:var(--dim); line-height:1; }
.modal-close:hover { color:var(--text); }
.compare-legend { display:flex; flex-wrap:wrap; gap:8px 16px; margin-bottom:12px; font-size:0.8rem; }

/* 空状态 */
.empty-state { text-align:center; padding:30px 20px; color:var(--dim); font-size:0.85rem; }

/* 标签 */
.tag { display:inline-block; padding:1px 8px; border-radius:3px; font-size:0.7rem; font-weight:600; }
.tag-green { background:rgba(76,175,80,0.2); color:var(--green); }
.tag-red { background:rgba(239,83,80,0.2); color:var(--red); }
.tag-yellow { background:rgba(255,167,38,0.2); color:var(--yellow); }

/* 状态条 */
.status-bar { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:6px; font-size:0.78rem; min-height:32px; }
.status-bar.info { background:rgba(79,195,247,0.1); color:var(--accent); }
.status-bar.success { background:rgba(239,83,80,0.1; color:var(--green); }
.status-bar.error { background:rgba(76,175,80,0.1; color:var(--red); }
.status-bar.waiting { background:rgba(255,167,38,0.1); color:var(--yellow); }

::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* 加载动画 */
@keyframes spin { to { transform:rotate(360deg); } }
.spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.6s linear infinite; vertical-align:middle; margin-right:6px; }
</style>
</head>
<body>

<header>
  <h1>🧪 回测实验室</h1>
  <div class="nav-links">
    <a href="/diagnose">个股诊断</a>
    <a href="/predict">预测看板</a>
    <a href="/backtest-view">策略回测</a>
    <a href="/">全部页面</a>
  </div>
</header>

<div class="container">
  <div class="lab-layout">

    <!-- ======== 左侧：配置面板 ======== -->
    <div class="sidebar">
      <div class="card">
        <div class="card-title">🎯 回测配置</div>

        <div class="form-group">
          <label>股票代码</label>
          <div class="search-wrap">
            <input type="text" id="stockInput" class="form-control" placeholder="输入代码或名称..." autocomplete="off">
            <div class="suggestions" id="stockSuggestions"></div>
          </div>
          <input type="hidden" id="stockCode">
        </div>

        <div class="form-group">
          <label>策略</label>
          <select id="strategySelect" class="form-control" onchange="onStrategyChange()">
            <option value="">-- 请选择策略 --</option>
          </select>
          <div id="strategyDesc" style="font-size:0.7rem;color:var(--dim);margin-top:4px;"></div>
        </div>

        <div class="form-group">
          <div style="display:flex;gap:8px;">
            <div style="flex:1;">
              <label>开始日期</label>
              <input type="date" id="startDate" class="form-control form-control-sm">
            </div>
            <div style="flex:1;">
              <label>结束日期</label>
              <input type="date" id="endDate" class="form-control form-control-sm">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>初始资金</label>
          <input type="number" id="capital" class="form-control form-control-sm" value="100000" step="10000" min="10000">
        </div>

        <!-- 动态参数区 -->
        <div id="paramsPanel" style="display:none;">
          <div style="border-top:1px solid var(--border);padding-top:10px;margin-top:2px;">
            <div class="card-title">⚙️ 策略参数</div>
            <div id="paramsList"></div>
          </div>
        </div>

        <button id="btnRun" class="btn btn-primary" style="width:100%;margin-top:6px;" onclick="runBacktest()" disabled>
           ▶ 运行回测
        </button>

        <div id="statusBar" class="status-bar info" style="margin-top:8px;">
          <span>配置完整后点击运行</span>
        </div>
      </div>
    </div>

    <!-- ======== 右侧：结果区域 ======== -->
    <div class="main-area">

      <!-- 结果区 -->
      <div id="resultArea" style="display:none;">
        <div class="card">
          <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
            <span>📊 回测结果</span>
            <span id="resultTitle" style="font-size:0.8rem;color:var(--dim);text-transform:none;"></span>
          </div>
          <div class="metrics-grid" id="metricsGrid"></div>
        </div>

        <div class="card">
          <div class="card-title">📈 净值曲线</div>
          <div class="chart-wrap"><canvas id="equityChart"></canvas></div>
        </div>

        <div class="card">
          <div class="card-title" style="display:flex;justify-content:space-between;">
            <span>📋 交易明细</span>
            <span id="tradeCount" style="font-size:0.72rem;color:var(--dim);font-weight:400;"></span>
          </div>
          <div class="table-wrap" id="tradeTableWrap">
            <table>
              <thead><tr><th>#</th><th>买入日</th><th>买入价</th><th>卖出日</th><th>卖出价</th><th>持仓</th><th>收益率</th><th>原因</th></tr></thead>
              <tbody id="tradeBody"></tbody>
            </table>
            <div id="tradeEmpty" class="empty-state" style="display:none;">该区间内无交易</div>
          </div>
        </div>
      </div>

      <!-- 空状态 -->
      <div id="emptyState" class="card">
        <div class="empty-state" style="padding:40px;">
          <div style="font-size:2.5rem;margin-bottom:8px;">🧪</div>
          <p>左侧配置参数后点击"运行回测"</p>
          <p style="font-size:0.75rem;margin-top:6px;">支持7大策略参数调整 · 每次回测自动存档 · 勾选多条后可对比</p>
        </div>
      </div>

      <!-- 日志 + 对比 -->
      <div class="card">
        <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
          <span>📜 回测日志 <span id="logCount" style="font-size:0.72rem;font-weight:400;color:var(--dim);"></span></span>
          <div>
            <button id="btnCompare" class="btn btn-sm btn-success" onclick="showCompare()" disabled>📊 对比选中</button>
            <button class="btn btn-sm btn-outline" onclick="clearHistory()" style="margin-left:4px;">🗑️ 清空</button>
          </div>
        </div>
        <div id="logList" class="log-grid">
          <div class="empty-state">暂无回测记录</div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ======== 对比模态框 ======== -->
<div class="modal-overlay" id="compareModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 style="font-size:1rem;">📊 回测对比</h3>
      <span class="modal-close" onclick="closeCompare()">×</span>
    </div>
    <div id="compareBody">
      <div class="empty-state">请选择2条以上回测记录</div>
    </div>
  </div>
</div>

<script>
// ===== 状态 =====
const STRATEGY_META_URL = '/api/strategies';
const BT_API = '/api/stock';

let state = {
  strategies: {},
  stockCode: '',
  stockName: '',
  currentResult: null,
  history: [],
  equityChart: null,
  compareChart: null,
};

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', () => {
  loadStrategies();
  setupSearch();
  setupDates();
  loadHistory();
  setupFormWatchers();
});

// ===== 日期 =====
function setupDates() {
  const today = new Date();
  document.getElementById('startDate').value = new Date(today.getFullYear()-3, today.getMonth(), today.getDate()+1).toISOString().slice(0,10);
  document.getElementById('endDate').value = today.toISOString().slice(0,10);
}

// ===== 加载策略 =====
async function loadStrategies() {
  try {
    const r = await fetch(STRATEGY_META_URL);
    const d = await r.json();
    state.strategies = d;
    const sel = document.getElementById('strategySelect');
    sel.innerHTML = '<option value="">-- 请选择策略 --</option>' +
      Object.entries(d).map(([k, v]) =>
        `<option value="${k}">${v.name || k}</option>`
      ).join('');
  } catch(e) {
    setStatus('加载策略失败: ' + e.message, 'error');
  }
}

// ===== 策略切换 =====
function onStrategyChange() {
  const sid = document.getElementById('strategySelect').value;
  const meta = state.strategies[sid];
  document.getElementById('strategyDesc').textContent = meta ? (meta.desc || '') : '';
  renderParams(sid);
  updateReady();
}

// ===== 渲染参数面板 =====
function renderParams(sid) {
  const panel = document.getElementById('paramsPanel');
  const list = document.getElementById('paramsList');
  const meta = state.strategies[sid];
  if (!meta || !meta.params || Object.keys(meta.params).length === 0) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'block';
  list.innerHTML = '';
  Object.entries(meta.params).forEach(([key, cfg]) => {
    const row = document.createElement('div');
    row.className = 'param-row';
    const label = document.createElement('label');
    label.textContent = cfg.label || key;
    const range = document.createElement('input');
    range.type = 'range';
    range.min = cfg.min;
    range.max = cfg.max;
    range.step = cfg.step || 1;
    range.value = cfg.default;
    range.id = 'param_' + key;
    const valSpan = document.createElement('span');
    valSpan.className = 'param-value';
    valSpan.textContent = cfg.default;
    range.oninput = () => { valSpan.textContent = Number(range.value).toFixed(cfg.step < 1 ? 1 : 0); };
    row.appendChild(label);
    row.appendChild(range);
    row.appendChild(valSpan);
    list.appendChild(row);
  });
}

// ===== 搜索 =====
let searchTimer = null;
function setupSearch() {
  const input = document.getElementById('stockInput');
  const sug = document.getElementById('stockSuggestions');
  input.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = input.value.trim();
    if (q.length < 1) { sug.style.display = 'none'; return; }
    searchTimer = setTimeout(async () => {
      try {
        const r = await fetch('/api/stock/search?q=' + encodeURIComponent(q));
        const d = await r.json();
        const items = d.results || [];
        if (!items.length) {
          sug.innerHTML = '<div style="color:var(--dim);padding:8px 12px;">无匹配</div>';
          sug.style.display = 'block'; return;
        }
        sug.innerHTML = items.slice(0,10).map(s =>
          `<div onclick="selectStock('${s.code}','${escHtml(s.name)}')">
            <span style="color:var(--accent);font-family:monospace;">${s.code}</span>
            <span>${escHtml(s.name)}</span>
            <span style="color:var(--dim);font-size:0.7rem;margin-left:6px;">[${s.match}]</span>
           </div>`
        ).join('');
        sug.style.display = 'block';
      } catch(e) {}
    }, 200);
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) sug.style.display = 'none';
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') updateReady(); });
}

function selectStock(code, name) {
  document.getElementById('stockInput').value = code + ' ' + name;
  document.getElementById('stockCode').value = code;
  document.getElementById('stockSuggestions').style.display = 'none';
  state.stockCode = code;
  state.stockName = name;
  updateReady();
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== 表单状态 =====
function setupFormWatchers() {
  ['stockInput','startDate','endDate','capital'].forEach(id => {
    document.getElementById(id).addEventListener('change', updateReady);
  });
  document.getElementById('stockInput').addEventListener('blur', () => {
    const v = document.getElementById('stockInput').value.trim();
    const m = v.match(/^(\d{6})/);
    if (m) selectStock(m[1], v.slice(7).trim() || m[1]);
  });
}

function updateReady() {
  const sid = document.getElementById('strategySelect').value;
  const code = document.getElementById('stockCode').value;
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  const cap = parseInt(document.getElementById('capital').value);

  const missing = [];
  if (!sid) missing.push('选策略');
  if (!code) missing.push('输代码');
  if (!start || !end) missing.push('选日期');
  if (isNaN(cap) || cap < 10000) missing.push('资金≥1万');
  if (start && end && start >= end) missing.push('结束>开始');

  const btn = document.getElementById('btnRun');
  const ready = missing.length === 0;
  btn.disabled = !ready;
  setStatus(ready ? '✅ 配置就绪，点击运行' : '⚠️ ' + missing.join(' · '), ready ? 'success' : 'info');
}

function setStatus(msg, type) {
  const bar = document.getElementById('statusBar');
  bar.className = 'status-bar ' + (type || 'info');
  bar.innerHTML = msg;
}

// ===== 运行回测 =====
async function runBacktest() {
  const sid = document.getElementById('strategySelect').value;
  const code = document.getElementById('stockCode').value;
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  const capital = parseInt(document.getElementById('capital').value);

  if (!sid || !code) return;

  const btn = document.getElementById('btnRun');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>回测中...';
  setStatus('⏳ 正在回测 ' + code + ' · ' + sid + ' ...', 'waiting');

  try {
    // 构建参数
    let params = [];
    const panel = document.getElementById('paramsList');
    panel.querySelectorAll('input[type="range"]').forEach(el => {
      params.push('param_' + el.id.replace('param_','') + '=' + el.value);
    });

    const url = BT_API + '/' + code + '/backtest?strategy=' + sid +
      '&start=' + start + '&end=' + end + '&capital=' + capital +
      (params.length ? '&' + params.join('&') : '');

    const r = await fetch(url);
    const result = await r.json();

    if (result.error) throw new Error(result.error);

    state.currentResult = result;
    renderResult(result);
    saveToHistory(result, sid, code, capital);
    setStatus('✅ 回测完成 · ' + (result.summary ? result.summary.totalReturn.toFixed(2) + '%' : ''), 'success');

  } catch(e) {
    setStatus('❌ ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = ' ▶ 运行回测';
  }
}

// ===== 渲染结果 =====
function renderResult(result) {
  const s = result.summary || {};
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultTitle').textContent = result.strategyName + ' · ' + result.code +
    ' · ' + (s.totalTrades || 0) + '笔交易';

  // 指标卡片
  const metrics = [
    { label: '总收益', value: s.totalReturn, fmt: 'pct', invert: false },
    { label: '夏普比率', value: s.sharpe, fmt: '.2f', invert: false },
    { label: '最大回撤', value: s.maxDrawdown, fmt: 'pct', invert: true },
    { label: '胜率', value: s.winRate, fmt: 'pct', invert: false },
    { label: '交易次数', value: s.totalTrades, fmt: 'int', invert: false },
    { label: '平均持仓', value: s.avgHoldDays, fmt: 'int', invert: false, suffix: '天' },
    { label: '基准收益', value: s.bhReturn, fmt: 'pct', invert: false },
    { label: '超额收益', value: s.excessReturn, fmt: 'pct', invert: false },
  ];

  document.getElementById('metricsGrid').innerHTML = metrics.map(m => {
    let display = '-';
    if (m.value != null) {
      if (m.fmt === 'pct') display = (m.value > 0 ? '+' : '') + m.value.toFixed(2) + '%';
      else if (m.fmt === '.2f') display = m.value.toFixed(2);
      else display = m.value + (m.suffix || '');
    }
    const cls = m.value != null
      ? (m.invert ? (m.value < 0 ? 'm-up' : 'm-down') : (m.value > 0 ? 'm-up' : 'm-down'))
      : '';
    return `<div class="metric-card"><div class="metric-val ${cls}">${display}</div><div class="metric-label">${m.label}</div></div>`;
  }).join('');

  // 净值曲线
  renderEquityCurve(result);

  // 交易明细
  renderTrades(result.trades);
}

function renderEquityCurve(result) {
  if (state.equityChart) { state.equityChart.destroy(); state.equityChart = null; }

  const equity = result.equityCurve || [];
  const bh = result.bhCurve || [];
  if (!equity.length) return;

  const labels = equity.map(e => e.date || e.x);
  const stratVals = equity.map(e => e.value || e.y);
  const bhMap = {};
  bh.forEach(b => { bhMap[b.date || b.x] = b.value || b.y; });
  const bhVals = labels.map(d => bhMap[d] || null);

  const ctx = document.getElementById('equityChart').getContext('2d');
  state.equityChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: '策略净值',
          data: stratVals,
          borderColor: '#4fc3f7',
          backgroundColor: 'rgba(79,195,247,0.06)',
          borderWidth: 2,
          pointRadius: 0,
          fill: true,
          tension: 0.15,
        },
        {
          label: '买入持有',
          data: bhVals,
          borderColor: '#666',
          borderWidth: 1.5,
          borderDash: [5,5],
          pointRadius: 0,
          tension: 0.15,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#aaa', font: { size: 10 }, boxWidth: 12 } },
        tooltip: {
          callbacks: {
            label: ctx => ctx.dataset.label + ': ¥' + Number(ctx.raw).toLocaleString()
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#666', font: { size: 9 }, maxTicksLimit: 10, callback: v => this.getLabelForValue(v).slice(0,7) },
          grid: { color: 'rgba(255,255,255,0.03)' },
        },
        y: {
          ticks: { color: '#666', font: { size: 9 }, callback: v => '¥' + Number(v).toLocaleString() },
          grid: { color: 'rgba(255,255,255,0.05)' },
        }
      }
    }
  });
}

function renderTrades(trades) {
  const body = document.getElementById('tradeBody');
  const empty = document.getElementById('tradeEmpty');
  const count = document.getElementById('tradeCount');

  if (!trades || !trades.length) {
    body.innerHTML = '';
    empty.style.display = 'block';
    count.textContent = '0笔';
    return;
  }
  empty.style.display = 'none';
  count.textContent = trades.length + '笔';
  body.innerHTML = trades.map((t, i) => {
    const ret = t.returnPct || 0;
    return '<tr>' +
      '<td>' + (i+1) + '</td>' +
      '<td>' + (t.entryDate || '').slice(0,10) + '</td>' +
      '<td>' + (t.entryPrice ? t.entryPrice.toFixed(2) : '-') + '</td>' +
      '<td>' + (t.exitDate || '').slice(0,10) + '</td>' +
      '<td>' + (t.exitPrice ? t.exitPrice.toFixed(2) : '-') + '</td>' +
      '<td>' + (t.holdDays || '-') + '</td>' +
      '<td style="font-weight:600;color:' + (ret >= 0 ? 'var(--red)' : 'var(--green)') + ';">' + (ret >= 0 ? '+' : '') + ret.toFixed(2) + '%</td>' +
      '<td style="font-size:0.72rem;color:var(--dim);">' + escHtml((t.reason || t.exitSignal || '').slice(0,30)) + '</td>' +
    '</tr>';
  }).join('');
}

// ===== 历史记录 (localStorage) =====
function saveToHistory(result, sid, code, capital) {
  const s = result.summary || {};
  const params = {};
  document.querySelectorAll('#paramsList input[type="range"]').forEach(el => {
    params[el.id.replace('param_','')] = el.value;
  });

  const record = {
    id: Date.now(),
    time: new Date().toLocaleString(),
    strategy: result.strategyName || sid,
    strategyId: sid,
    code: result.code || code,
    capital: capital,
    params: JSON.stringify(params),
    totalReturn: s.totalReturn,
    sharpe: s.sharpe,
    maxDrawdown: s.maxDrawdown,
    winRate: s.winRate,
    totalTrades: s.totalTrades,
    bhReturn: s.bhReturn,
    excessReturn: s.excessReturn,
    // 存完整结果用于对比
    equityCurve: JSON.stringify((result.equityCurve || []).slice(0, 2000)),
    bhCurve: JSON.stringify((result.bhCurve || []).slice(0, 2000)),
  };

  state.history.unshift(record);
  if (state.history.length > 100) state.history = state.history.slice(0, 100);
  localStorage.setItem('btlab_history', JSON.stringify(state.history));
  renderHistory();
}

function loadHistory() {
  try {
    const raw = localStorage.getItem('btlab_history');
    if (raw) state.history = JSON.parse(raw);
  } catch(e) { state.history = []; }
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('logList');
  const count = document.getElementById('logCount');
  count.textContent = '(' + state.history.length + ')';

  if (!state.history.length) {
    list.innerHTML = '<div class="empty-state">暂无回测记录</div>';
    return;
  }

  list.innerHTML = state.history.map((r, i) => {
    const ret = r.totalReturn;
    const retColor = ret != null ? (ret >= 0 ? 'var(--red)' : 'var(--green)') : 'var(--dim)';
    const sharpeColor = r.sharpe != null ? (r.sharpe >= 0 ? 'var(--red)' : 'var(--green)') : 'var(--dim)';
    return `<div class="log-row" data-idx="${i}" onclick="toggleLog(${i})">
      <input type="checkbox" class="log-cb" data-idx="${i}" onclick="event.stopPropagation(); onCheckChange()">
      <span style="display:flex;gap:6px;align-items:center;">
        <span class="log-time">${(r.time||'').slice(5,16)}</span>
        <span class="log-strat">${escHtml(r.strategy||'')}</span>
      </span>
      <span class="log-code">${r.code||''}</span>
      <span class="log-return" style="color:${retColor}">${ret != null ? (ret>=0?'+':'')+ret.toFixed(1)+'%' : '-'}</span>
      <span style="color:${sharpeColor}">${r.sharpe != null ? r.sharpe.toFixed(2) : '-'}</span>
      <span style="color:var(--dim);">${r.totalTrades != null ? r.totalTrades+'笔' : '-'}</span>
      <span style="color:var(--dim);font-size:0.7rem;">
        ${r.params ? Object.entries(JSON.parse(r.params)).slice(0,2).map(([k,v]) => k+'='+v).join(' ') : ''}
      </span>
    </div>`;
  }).join('');

  updateCompareBtn();
}

function toggleLog(idx) {
  const row = document.querySelector(`.log-row[data-idx="${idx}"]`);
  if (row) {
    row.classList.toggle('selected');
    const cb = row.querySelector('.log-cb');
    if (cb) cb.checked = !cb.checked;
  }
  onCheckChange();
}

function onCheckChange() {
  updateCompareBtn();
}

function updateCompareBtn() {
  const checked = document.querySelectorAll('.log-cb:checked').length;
  document.getElementById('btnCompare').disabled = checked < 2;
}

function clearHistory() {
  if (!confirm('确定清空所有回测日志？')) return;
  state.history = [];
  localStorage.removeItem('btlab_history');
  renderHistory();
}

// ===== 对比功能 =====
function showCompare() {
  const checked = document.querySelectorAll('.log-cb:checked');
  if (checked.length < 2) return;

  const indices = Array.from(checked).map(cb => parseInt(cb.dataset.idx));
  const records = indices.map(i => state.history[i]).filter(Boolean);

  document.getElementById('compareModal').classList.add('show');
  renderCompare(records);
}

function closeCompare() {
  document.getElementById('compareModal').classList.remove('show');
  if (state.compareChart) { state.compareChart.destroy(); state.compareChart = null; }
}

function renderCompare(records) {
  const body = document.getElementById('compareBody');
  const colors = ['#4fc3f7','#ef5350','#66bb6a','#ffa726','#ab47bc','#26c6da','#7c4dff'];

  // 指标对比表
  const fields = [
    { key: 'totalReturn', label: '总收益', fmt: 'pct' },
    { key: 'sharpe', label: '夏普比率', fmt: '.2f' },
    { key: 'maxDrawdown', label: '最大回撤', fmt: 'pct' },
    { key: 'winRate', label: '胜率', fmt: 'pct' },
    { key: 'totalTrades', label: '交易次数', fmt: 'int' },
    { key: 'bhReturn', label: '基准收益', fmt: 'pct' },
    { key: 'excessReturn', label: '超额收益', fmt: 'pct' },
  ];

  let html = '<div class="compare-legend">';
  records.forEach((r, i) => {
    html += `<span style="color:${colors[i%colors.length]};font-weight:600;">■ ${escHtml(r.strategy)} ${r.code}</span>`;
  });
  html += '</div>';

  html += '<div class="table-wrap" style="max-height:300px;margin-bottom:16px;"><table><thead><tr><th>指标</th>';
  records.forEach((r, i) => { html += `<th style="color:${colors[i%colors.length]};">#${i+1} ${escHtml(r.strategy)}</th>`; });
  html += '</tr></thead><tbody>';

  fields.forEach(f => {
    html += '<tr><td style="font-weight:600;">' + f.label + '</td>';
    records.forEach(r => {
      const v = r[f.key];
      let display = '-';
      if (v != null) {
        if (f.fmt === 'pct') display = (v > 0 ? '+' : '') + v.toFixed(2) + '%';
        else if (f.fmt === '.2f') display = v.toFixed(2);
        else display = v;
      }
      const best = Math.max(...records.map(x => x[f.key] != null ? x[f.key] : -Infinity));
      const isBest = v != null && Math.abs(v - best) < 0.001;
      html += '<td style="' + (isBest ? 'color:var(--green);font-weight:700;' : '') + '">' + display + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  // 参数列
  html += '<div style="font-size:0.78rem;color:var(--dim);margin-bottom:16px;"><strong style="color:var(--text);">参数: </strong>';
  records.forEach((r, i) => {
    try {
      const p = JSON.parse(r.params || '{}');
      const pStr = Object.entries(p).map(([k,v]) => k+'='+v).join(', ');
      html += `<span style="margin-right:16px;color:${colors[i%colors.length]};">#${i+1}: ${pStr || '-'}</span>`;
    } catch(e) {}
  });
  html += '</div>';

  // 净值叠加图
  html += '<div style="height:360px;"><canvas id="compareChartCanvas"></canvas></div>';
  body.innerHTML = html;

  // 渲染对比图表
  setTimeout(() => renderCompareChart(records, colors), 100);
}

function renderCompareChart(records, colors) {
  const canvas = document.getElementById('compareChartCanvas');
  if (!canvas) return;
  if (state.compareChart) { state.compareChart.destroy(); state.compareChart = null; }

  const datasets = [];
  let allLabels = [];

  records.forEach((r, i) => {
    try {
      const eq = JSON.parse(r.equityCurve || '[]');
      const labels = eq.map(e => e.date || e.x);
      const values = eq.map(e => e.value || e.y);
      if (labels.length > allLabels.length) {
        allLabels = labels;
      }
      datasets.push({
        label: '#' + (i+1) + ' ' + r.strategy,
        data: values,
        borderColor: colors[i % colors.length],
        backgroundColor: 'transparent',
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.15,
      });
    } catch(e) {}
  });

  if (!datasets.length) return;

  const ctx = canvas.getContext('2d');
  state.compareChart = new Chart(ctx, {
    type: 'line',
    data: { labels: allLabels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#aaa', font: { size: 10 }, boxWidth: 12 } },
        tooltip: {
          callbacks: {
            label: ctx => ctx.dataset.label + ': ¥' + Number(ctx.raw).toLocaleString()
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#666', font: { size: 9 }, maxTicksLimit: 10, callback: v => this.getLabelForValue(v).slice(0,7) },
          grid: { color: 'rgba(255,255,255,0.03)' },
        },
        y: {
          ticks: { color: '#666', font: { size: 9 }, callback: v => '¥' + Number(v).toLocaleString() },
          grid: { color: 'rgba(255,255,255,0.05)' },
        }
      }
    }
  });
}

// 点击模态外部关闭
document.getElementById('compareModal').addEventListener('click', function(e) {
  if (e.target === this) closeCompare();
});
</script>
</body>
</html>
