# ============================================================
# 策略注册表
# 每项策略需指定: name, class_path, params, description
# ============================================================

strategies:
  # ---- 内置预设策略 ----
  
  - name: "双均线交叉"
    class_path: "src.strategies.ma_cross.MACrossStrategy"
    params:
      fast_period: 5
      slow_period: 20
    description: "短期均线上穿长期均线买入，下穿卖出。经典趋势跟踪策略。"
    source: "基于移动平均线交叉概念，广泛应用于技术分析"
    strategy_type: "signal"

  - name: "MACD金叉死叉"
    class_path: "src.strategies.macd_signal.MACDSignalStrategy"
    params:
      fast_period: 12
      slow_period: 26
      signal_period: 9
    description: "MACD线上穿信号线买入，下穿卖出。"
    source: "Appel, G. (1979). The Moving Average Convergence-Divergence Method"
    strategy_type: "signal"

  - name: "RSI超买超卖"
    class_path: "src.strategies.rsi_reversal.RSIReversalStrategy"
    params:
      rsi_period: 14
      oversold_threshold: 30
      overbought_threshold: 70
    description: "RSI低于超卖阈值买入，高于超买阈值卖出。均值回归策略。"
    source: "Wilder, J. W. (1978). New Concepts in Technical Trading Systems"
    strategy_type: "signal"

  - name: "布林带突破"
    class_path: "src.strategies.bollinger_breakout.BollingerBreakoutStrategy"
    params:
      period: 20
      std_dev: 2.0
    description: "价格突破布林带下轨买入，突破上轨卖出。波动率策略。"
    source: "Bollinger, J. (2001). Bollinger on Bollinger Bands"
    strategy_type: "signal"

  - name: "海龟交易法则"
    class_path: "src.strategies.turtle_trading.TurtleTradingStrategy"
    params:
      entry_period: 20
      exit_period: 10
      atr_period: 20
      atr_multiplier: 2.0
    description: "唐奇安通道突破入场，ATR动态止损。经典趋势跟踪策略。"
    source: "Faith, C. (2007). Way of the Turtle"
    strategy_type: "signal"

  # ---- v2.0 A股核心选股策略 (Portfolio Selection) ----
  # 策略类型: portfolio — 全市场选股+等权组合+定期调仓

  - name: "小市值选股"
    class_path: "src.strategies.small_cap.SmallCapStrategy"
    params:
      n_stocks: 20
      rebalance_days: 20
      lookback_days: 20
      min_amount_wan: 3000
    description: "选择估算市值最小的N只股票，定期调仓。A股最可靠Alpha来源。"
    source: "Fama & French (1993). Common Risk Factors"
    strategy_type: "portfolio"

  - name: "短期反转选股"
    class_path: "src.strategies.reversal.ReversalStrategy"
    params:
      n_stocks: 20
      rebalance_days: 20
      lookback_days: 20
      min_return: -30
    description: "选择近期跌幅最大的N只股票，博弈超跌反弹。行为金融核心策略。"
    source: "Jegadeesh (1990). Evidence of Predictable Behavior"
    strategy_type: "portfolio"

  - name: "低波动选股"
    class_path: "src.strategies.low_volatility.LowVolatilityStrategy"
    params:
      n_stocks: 20
      rebalance_days: 60
      lookback_days: 60
    description: "选择波动率最低的N只股票，低波动异象策略。防御利器。"
    source: "Baker, Bradley & Wurgler (2011). Benchmarks as Limits to Arbitrage"
    strategy_type: "portfolio"

  - name: "低换手选股"
    class_path: "src.strategies.low_turnover.LowTurnoverStrategy"
    params:
      n_stocks: 20
      rebalance_days: 60
      lookback_days: 60
      max_turnover: 1.0
      min_market_cap_yi: 50
    description: "选择换手率最低的N只股票，筹码锁定信号。流动性溢价策略。"
    source: "Datar, Naik & Radcliffe (1998). Liquidity and Stock Returns"
    strategy_type: "portfolio"

  # ---- v2.0 A股量化模型 (Composite Models) ----

  - name: "三因子均衡"
    class_path: "src.models.three_factor.ThreeFactorStrategy"
    params:
      n_stocks: 300
      rebalance_days: 20
      lookback_days: 252
      min_amount_wan: 3000
      min_price: 2.0
      min_list_days: 250
    description: "三因子等权组合：小市值(33%)+反转(33%)+低波动(33%)，月度调仓，最多300只等权持有。A股最稳健Alpha组合。"
    source: "Fama & French (1993); Jegadeesh (1990); Baker, Bradley & Wurgler (2011)"
    strategy_type: "portfolio"

  - name: "技术指标投票模型"
    class_path: "src.models.technical_voting.TechnicalVotingModel"
    params:
      entry_threshold: 2
      exit_threshold: -2
      max_positions: 10
      single_stop_loss: -0.08
      portfolio_stop: -0.15
    description: "5策略投票委员会：双均线+MACD+RSI+布林带+海龟，总分≥+2买入/≤-2卖出，最多持仓10只。"
    source: "综合投票模型: Appel(1979); Wilder(1978); Bollinger(2001); Faith(2007)"
    strategy_type: "voting"

  - name: "极致小市值"
    class_path: "src.models.extreme_small_cap.ExtremeSmallCapStrategy"
    params:
      n_stocks: 50
      candidate_pool: 200
      rebalance_days: 20
      lookback_days: 20
      min_amount_wan: 5000
      min_price: 3.0
      min_list_days: 250
    description: "五层过滤选最小50只：剔除ST/低股价/次新/低流动，市值最小200中精选。适合卫星仓位。"
    source: "Fama & French (1993) SMB因子增强; Asness et al. (2019). Size Matters"
    strategy_type: "portfolio"

  - name: "盾+矛全天候"
    class_path: "src.models.shield_spear.ShieldSpearStrategy"
    params:
      n_stocks: 200
      rebalance_days: 20
      lookback_days: 60
      min_amount_wan: 3000
      min_price: 2.0
      min_list_days: 250
    description: "市场温度计动态调节：进攻(盾30:矛70)/中性(50:50)/防御(70:30)。盾=低波动，矛=小市值+反转。熊市抗跌。"
    source: "市场温度计 + Fama & French (1993) + Jegadeesh (1990) + Baker et al. (2011)"
    strategy_type: "portfolio"

  - name: "v5_hybrid 超卖反转+趋势确认"
    class_path: "src.strategies.stock_screener.strategies.v5_hybrid.V5HybridStrategy"
    params:
      MAX_RSI_14: 38
      MAX_RSI_6: 26
      MAX_BB_POSITION: 0.10
      MAX_DRAWDOWN_60D: -8
      TREND_CHECKS_MIN: 2
      STOP_LOSS: -0.07
      TAKE_PROFIT: 0.15
      TRAILING_STOP: 0.12
      TRAILING_DD: -0.03
    description: "v5_hybrid 超卖反转+趋势确认双重验证。最优参数来自 #54 (RSI14=38, BB=0.10, DD=-8, TREND=2) 和 #67 (仓位8%) 参数扫描。"
    source: "自定义策略，基于 Wilder(1978) RSI + Bollinger(2001) + 趋势拟合"
    strategy_type: "stock_screener"  # ⚠️ 走 stock_screener 私有回测引擎, 不兼容主引擎 BaseStrategy(backtesting.Strategy)
    engine: "stock_screener"
