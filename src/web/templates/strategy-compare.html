<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>策略对比 · 7大策略全景</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e0e0e0;--dim:#888;--accent:#4fc3f7;--green:#4caf50;--red:#ef5350;--yellow:#ffa726}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:1.1rem;font-weight:600}
header .nav-links{margin-left:auto;display:flex;gap:12px}
header a{color:var(--dim);text-decoration:none;font-size:0.8rem}
header a:hover{color:var(--accent)}
.container{max-width:1200px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.card-title{font-size:0.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.card-title .badge{font-size:0.65rem;text-transform:none;padding:2px 10px;border-radius:10px;background:rgba(79,195,247,0.15);color:var(--accent)}

/* 统计头 */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:0}
.stat-card{text-align:center;padding:14px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid var(--border)}
.stat-icon{font-size:1.4rem;margin-bottom:2px}
.stat-val{font-size:1.5rem;font-weight:700}
.stat-label{font-size:0.68rem;color:var(--dim);margin-top:2px;text-transform:uppercase}

/* 策略颜色表 */
.strat-color-0{color:#ef5350}.strat-color-1{color:#ffa726}.strat-color-2{color:#4fc3f7}
.strat-color-3{color:#66bb6a}.strat-color-4{color:#ab47bc}.strat-color-5{color:#26c6da}.strat-color-6{color:#ec407a}
.bg-s0{background:#ef5350}.bg-s1{background:#ffa726}.bg-s2{background:#4fc3f7}.bg-s3{background:#66bb6a}.bg-s4{background:#ab47bc}.bg-s5{background:#26c6da}.bg-s6{background:#ec407a}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:0.82rem}
th{padding:10px 8px;border-bottom:2px solid var(--border);color:var(--dim);font-weight:600;font-size:0.7rem;text-transform:uppercase;text-align:center;position:sticky;top:0;background:var(--card)}
td{padding:8px;border-bottom:1px solid rgba(42,45,58,0.3);text-align:center}
tr:first-child td{border-top:none}
tr:hover td{background:rgba(255,255,255,0.02)}
tr.top-ranked td{background:rgba(239,83,80,0.06)}
.pos{color:var(--red);font-weight:600}
.neg{color:var(--green);font-weight:600}
.zero{color:var(--dim)}

/* 图表 */
.chart-wrap{height:300px;position:relative}
.chart-wrap-sm{height:260px;position:relative}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid-2{grid-template-columns:1fr}}

/* 进度条表 */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:0.82rem}
.bar-label{width:100px;flex-shrink:0;text-align:right}
.bar-track{flex:1;height:22px;background:#1e2130;border-radius:11px;overflow:hidden}
.bar-fill{height:100%;border-radius:11px;transition:width 0.8s ease}
.bar-val{width:70px;text-align:right;font-family:monospace;flex-shrink:0}

/* 排行标签 */
.rank-badge{display:inline-block;padding:1px 8px;border-radius:8px;font-size:0.65rem;font-weight:700}
.rank-1{background:rgba(239,83,80,0.2);color:var(--red)}
.rank-2{background:rgba(255,167,38,0.2);color:var(--yellow)}
.rank-3{background:rgba(79,195,247,0.2);color:var(--accent)}

/* 加载/空 */
.loading{text-align:center;padding:60px}
.footer{text-align:center;padding:20px;color:var(--dim);font-size:0.75rem;border-top:1px solid var(--border)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:6px}

/* 统一 header 修复（脚本自动注入） */
header {
    display: flex !important;
    align-items: center !important;
    gap: 16px !important;
    padding: 12px 24px !important;
    min-height: 56px !important;
    background: var(--card, #1a1d27) !important;
    border-bottom: 1px solid var(--border, #2a2d3a) !important;
    position: relative !important;
    z-index: 10 !important;
}
header h1 {
    font-size: 1.15rem !important;
    font-weight: 600 !important;
    margin: 0 !important;
    white-space: nowrap !important;
    /* emoji 字体回退（修复 Windows 上 🔬 显示成乱码"❾"） */
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', 'Twemoji Mozilla', sans-serif !important;
}
header h1 .h1-icon {
    display: inline-block;
    margin-right: 6px;
    font-size: 1.25rem;
    vertical-align: -2px;
}
header .nav-links, header > a[href="/"] {
    margin-left: auto !important;
    color: var(--dim, #888) !important;
    text-decoration: none !important;
    font-size: 0.85rem !important;
    padding: 4px 12px !important;
    border-radius: 6px !important;
    transition: all 0.15s !important;
    white-space: nowrap !important;
}
header .nav-links a, header > a[href="/"] {
    color: var(--dim, #888) !important;
    text-decoration: none !important;
}
header .nav-links a:hover, header > a[href="/"]:hover {
    color: var(--accent, #4fc3f7) !important;
    background: rgba(79, 195, 247, 0.08) !important;
}
header > span, header > .sub {
    color: var(--dim, #888) !important;
    font-size: 0.82rem !important;
}

</style>
    {{ _api_auth_snippet | safe }}
  </head>
<body>
<header>
  <h1>📊 7大策略全景对比</h1>
  <span style="font-size:0.75rem;color:var(--dim)">1492次回测 · 200只股票 · 7策略</span>
  <div class="nav-links">
    <a href="/">← 返回首页</a>
  </div>
</header>
<div class="container">

  <div id="loadingState" class="card loading">
    <span class="spinner"></span> 加载策略对比数据...
  </div>

  <div id="contentArea" style="display:none">

    <!-- 概览统计 -->
    <div class="card">
      <div class="card-title">📊 总览 <span class="badge" id="totalBadge">-</span></div>
      <div class="stats-row" id="statsRow"></div>
    </div>

    <!-- 对比表 -->
    <div class="card">
      <div class="card-title">📋 7大策略指标对比 <span class="badge">按平均收益排序</span></div>
      <div class="table-wrap" style="overflow-x:auto">
        <table><thead><tr>
          <th>排名</th><th style="text-align:left">策略</th><th>回测数</th><th>平均收益</th><th>盈利占比</th><th>空仓</th>
          <th>夏普</th><th>胜率</th><th>最佳</th><th>最差</th><th>均交易</th><th>均回撤</th><th>超额收益</th>
        </tr></thead><tbody id="compareTableBody"></tbody></table>
      </div>
    </div>

    <!-- 图表区 -->
    <div class="grid-2">
      <div class="card"><div class="card-title">📈 平均收益对比</div><div class="chart-wrap-sm"><canvas id="returnChart"></canvas></div></div>
      <div class="card"><div class="card-title">🎯 胜率对比</div><div class="chart-wrap-sm"><canvas id="winRateChart"></canvas></div></div>
      <div class="card"><div class="card-title">⚡ 夏普比率对比</div><div class="chart-wrap-sm"><canvas id="sharpeChart"></canvas></div></div>
      <div class="card"><div class="card-title">📊 收益 vs 夏普</div><div class="chart-wrap-sm"><canvas id="scatterChart"></canvas></div></div>
    </div>

    <!-- 各策略最佳股票 -->
    <div class="card">
      <div class="card-title">🏆 各策略最佳股票 TOP5</div>
      <div id="topStocksGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px"></div>
    </div>

  </div>

  <div class="footer">A股量化回测系统 · 7大策略 · 回测区间 2024-01 ~ 2026-06</div>
</div>

<script>
const STRAT_COLORS = ['#ef5350','#ffa726','#4fc3f7','#66bb6a','#ab47bc','#26c6da','#ec407a'];
let charts = {};

async function loadData() {
  try {
    const r = await fetch('/api/strategy/compare');
    const d = await r.json();
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('contentArea').style.display = 'block';
    renderStats(d);
    renderTable(d);
    renderCharts(d);
    renderTopStocks(d);
  } catch(e) {
    document.getElementById('loadingState').innerHTML = '❌ 加载失败: ' + e.message;
  }
}

function renderStats(d) {
  document.getElementById('totalBadge').textContent = d.total_records + '条';
  const s = d.strategies;
  const avgAll = s.reduce((a,b) => a + (b.avg_return||0), 0) / s.length;
  const best = s[0];
  const worst = s[s.length-1];
  document.getElementById('statsRow').innerHTML =
    `<div class="stat-card"><div class="stat-icon">📊</div><div class="stat-val">${d.total_records}</div><div class="stat-label">总回测</div></div>` +
    `<div class="stat-card"><div class="stat-icon">📈</div><div class="stat-val" style="color:var(--red)">${(best.avg_return||0).toFixed(2)}%</div><div class="stat-label">最佳策略: ${best.name}</div></div>` +
    `<div class="stat-card"><div class="stat-icon">📉</div><div class="stat-val" style="color:var(--green)">${(worst.avg_return||0).toFixed(2)}%</div><div class="stat-label">最差策略: ${worst.name}</div></div>` +
    `<div class="stat-card"><div class="stat-icon">🎯</div><div class="stat-val">${avgAll.toFixed(2)}%</div><div class="stat-label">7策略平均</div></div>` +
    `<div class="stat-card"><div class="stat-icon">📦</div><div class="stat-val">${s.length}</div><div class="stat-label">策略数</div></div>`;
}

function renderTable(d) {
  const body = document.getElementById('compareTableBody');
  body.innerHTML = d.strategies.map((s, i) => {
    const active = s.cnt - (s.flat_count||0);
    const wr = active > 0 ? (s.win_count / active * 100) : 0;
    const rankClass = i < 3 ? `rank-${i+1}` : '';
    return `<tr class="${i === 0 ? 'top-ranked' : ''}">
      <td><span class="rank-badge ${rankClass}">#${i+1}</span></td>
      <td style="text-align:left;font-weight:600"><span class="strat-color-${i}">■</span> ${s.name}</td>
      <td>${s.cnt}</td>
      <td class="${(s.avg_return||0) >= 0 ? 'pos' : 'neg'}">${(s.avg_return||0) >= 0 ? '+' : ''}${(s.avg_return||0).toFixed(2)}%</td>
      <td>${active > 0 ? (s.win_count/active*100).toFixed(1) + '%' : '-'}</td>
      <td style="color:var(--dim)">${s.flat_count||0}</td>
      <td class="${(s.avg_sharpe||0) >= 0 ? 'pos' : 'neg'}">${(s.avg_sharpe||0) >= 0 ? '+' : ''}${(s.avg_sharpe||0).toFixed(2)}</td>
      <td>${(s.avg_win_rate||0).toFixed(1)}%</td>
      <td class="pos">${(s.best_return||0) >= 0 ? '+' : ''}${(s.best_return||0).toFixed(1)}%</td>
      <td class="neg">${(s.worst_return||0).toFixed(1)}%</td>
      <td>${(s.avg_trades||0).toFixed(0)}笔</td>
      <td class="neg">${(s.avg_drawdown||0).toFixed(1)}%</td>
      <td class="${(s.avg_excess||0) >= 0 ? 'pos' : 'neg'}">${(s.avg_excess||0) >= 0 ? '+' : ''}${(s.avg_excess||0).toFixed(2)}%</td>
    </tr>`;
  }).join('');
}

function renderCharts(d) {
  const labels = d.strategies.map(s => s.name);
  const avgReturns = d.strategies.map(s => s.avg_return||0);
  const winRates = d.strategies.map(s => {const a = s.cnt - (s.flat_count||0); return a > 0 ? (s.win_count/a*100) : 0});
  const sharpes = d.strategies.map(s => s.avg_sharpe||0);
  // 散点图
  const scatterData = d.strategies.map((s, i) => ({x: s.avg_sharpe||0, y: s.avg_return||0, label: s.name}));

  makeChart('returnChart', 'bar', labels, avgReturns, '平均收益 (%)', '#ef5350');
  makeChart('winRateChart', 'bar', labels, winRates, '盈利占比 (%)', '#66bb6a');
  makeChart('sharpeChart', 'bar', labels, sharpes, '夏普比率', '#4fc3f7');

  // 散点
  destroyChart('scatterChart');
  charts.scatterChart = new Chart(document.getElementById('scatterChart').getContext('2d'), {
    type: 'scatter',
    data: {
      datasets: [{
        label: '策略',
        data: scatterData,
        backgroundColor: STRAT_COLORS.slice(0, scatterData.length),
        pointRadius: 10,
        pointHoverRadius: 14,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ctx.raw.label + ': 收益' + (ctx.raw.y >= 0 ? '+' : '') + ctx.raw.y.toFixed(2) + '% 夏普' + ctx.raw.x.toFixed(2)
          }
        }
      },
      scales: {
        x: { title: { display: true, text: '夏普比率', color: '#666' }, ticks: { color: '#888' }, grid: { color: 'rgba(255,255,255,0.03)' } },
        y: { title: { display: true, text: '平均收益 (%)', color: '#666' }, ticks: { color: '#888', callback: v => v + '%' }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
}

function makeChart(id, type, labels, data, label, color) {
  destroyChart(id);
  charts[id] = new Chart(document.getElementById(id).getContext('2d'), {
    type,
    data: {
      labels,
      datasets: [{ label, data, backgroundColor: STRAT_COLORS.slice(0, labels.length), borderRadius: 4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => { const v = ctx.raw; return v >= 0 ? '+' + v.toFixed(2) + '%' : v.toFixed(2) + '%'; } } }
      },
      scales: {
        x: { ticks: { color: '#888', callback: v => v + '%' }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: '#aaa', font: { size: 10 } }, grid: { display: false } }
      }
    }
  });
}

function renderTopStocks(d) {
  const grid = document.getElementById('topStocksGrid');
  grid.innerHTML = (d.strategies || []).map((s, si) => {
    const tops = (d.top_by_strategy && d.top_by_strategy[s.strategy_id]) || [];
    const html = tops.slice(0, 5).map((t, i) => {
      const ret = t.total_return || 0;
      return `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(42,45,58,0.3);font-size:0.78rem">
        <span><span class="rank-badge rank-${i < 3 ? i+1 : 3}" style="margin-right:4px">#${i+1}</span> <span style="font-family:monospace">${t.stock_code}</span></span>
        <span style="color:${ret >= 0 ? 'var(--red)' : 'var(--green)'};font-weight:600">${ret >= 0 ? '+' : ''}${ret.toFixed(2)}%</span>
      </div>`;
    }).join('');
    return `<div style="border:1px solid var(--border);border-radius:8px;padding:10px;background:rgba(255,255,255,0.01)">
      <div style="font-size:0.82rem;font-weight:600;margin-bottom:6px;color:${STRAT_COLORS[si % STRAT_COLORS.length]}">■ ${s.name}</div>
      ${html || '<div style="color:var(--dim);font-size:0.75rem;padding:8px;text-align:center">暂无数据</div>'}
    </div>`;
  }).join('');
}

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
