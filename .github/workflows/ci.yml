name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Lint ────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install lint tools
        run: pip install flake8
      - name: Run flake8
        # 收紧:不再 continue-on-error
        # 规则在 .flake8 配置;新增 F401(未用 import) / F811(重复定义)
        # 暂时只跑 E/W,避免一次性触发大量历史 violation
        run: flake8 src/ tests/ scripts/ --statistics

  # ─── Test ────────────────────────────────────────────
  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # --require-hashes 强制校验 sha256,防 supply chain 攻击
          pip install --require-hashes -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests with coverage
        run: |
          mkdir -p database
          # 起步门禁 30%,后续 PR 持续提升
          # 历史 0 覆盖率,直接设 80% 会立即红;先低门槛建立习惯
          python -m pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=30 \
            -v --tb=short
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false   # codecov 故障不应阻塞 PR
          verbose: false

  # ─── Dependency security scan ────────────────────────
  audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: |
          pip-audit --strict -r requirements.txt
        continue-on-error: false

  # ─── E2E (Playwright) ────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
      - name: Start server in background
        run: |
          mkdir -p database
          python run.py --port 5050 &
          # 等待服务器就绪（最多 30s）
          for i in $(seq 1 30); do
            curl -s http://localhost:5050/dashboard > /dev/null && break
            sleep 1
          done
      - name: Setup Playwright
        run: |
          pip install pytest-playwright
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: |
          python -m pytest tests/e2e/ -v --tb=short -m e2e
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore

  # ─── Release (tag push only) ─────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, audit]
    steps:
      - uses: actions/checkout@v4
      - name: Generate release notes
        run: |
          git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD --oneline > /tmp/release_notes.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.txt
          generate_release_notes: true
